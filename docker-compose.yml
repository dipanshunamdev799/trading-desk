services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: trading_v2_timescaledb
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - trading_pgdata:/home/postgres/pgdata/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  trading_pgdata:
